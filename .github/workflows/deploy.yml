name: Deploy Contracts

on:
  workflow_dispatch:
    inputs:
      network:
        description: 'Network to deploy to'
        required: true
        type: choice
        options:
          - sepolia
          - scroll-sepolia
          - polygon-mumbai
          - mainnet
          - scroll
          - polygon
      contract:
        description: 'Contract to deploy (leave empty for all)'
        required: false
        type: string

jobs:
  deploy:
    name: Deploy to ${{ github.event.inputs.network }}
    runs-on: ubuntu-latest
    
    environment:
      name: ${{ github.event.inputs.network }}
    
    steps:
      - name: 🔥 Checkout code
        uses: actions/checkout@v5
        
      - name: Prepare Node.js and npm dependencies
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: '20.x'
        
      - name: 🏗️ Compile contracts
        run: npm run compile
        
      - name: ⚠️ Deployment Pre-check
        run: |
          echo "🔍 Deploying to: ${{ github.event.inputs.network }}"
          echo "📋 Contract: ${{ github.event.inputs.contract || 'ALL' }}"
          echo "👤 Triggered by: ${{ github.actor }}"
          echo "⏰ Timestamp: $(date -u)"
          
      - name: 🚀 Deploy contracts
        run: |
          case "${{ github.event.inputs.network }}" in
            sepolia)
              npm run deploy:sepolia
              ;;
            scroll-sepolia)
              npm run deploy:scroll-sepolia
              ;;
            scroll)
              npm run deploy:scroll
              ;;
            polygon)
              npm run deploy:polygon
              ;;
            mainnet)
              echo "⚠️ WARNING: Deploying to MAINNET"
              npm run deploy:mainnet
              ;;
            *)
              echo "Unknown network"
              exit 1
              ;;
          esac
        env:
          PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
          MAINNET_RPC_URL: ${{ secrets.MAINNET_RPC_URL }}
          SEPOLIA_RPC_URL: ${{ secrets.SEPOLIA_RPC_URL }}
          POLYGON_RPC_URL: ${{ secrets.POLYGON_RPC_URL }}
          SCROLL_RPC_URL: ${{ secrets.SCROLL_RPC_URL }}
          SCROLL_SEPOLIA_RPC_URL: ${{ secrets.SCROLL_SEPOLIA_RPC_URL }}
          ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
          POLYGONSCAN_API_KEY: ${{ secrets.POLYGONSCAN_API_KEY }}
          SCROLLSCAN_API_KEY: ${{ secrets.SCROLLSCAN_API_KEY }}
          
      - name: ✅ Deployment Summary
        if: success()
        run: |
          echo "✅ Deployment to ${{ github.event.inputs.network }} completed successfully!"
          echo "📝 Please verify contracts on block explorer"
          
      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "❌ Deployment to ${{ github.event.inputs.network }} failed!"
          echo "🔍 Check logs above for details"
