name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: 🔥 Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          
      - name: Prepare Node.js and npm dependencies
        uses: ./.github/actions/setup-node-npm
        with:
          node-version: '20.x'
        
      - name: 🏗️ Build
        run: npm run compile
        
      - name: 🧪 Run tests
        run: npm test
        
      - name: 📝 Generate changelog
        id: changelog
        run: |
          # Extract version from tag
          VERSION=${GITHUB_REF#refs/tags/}
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          
          # Generate changelog (basic version)
          echo "## What's Changed" > CHANGELOG.txt
          git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"- %s (%h)" >> CHANGELOG.txt || echo "- Initial release" >> CHANGELOG.txt
          
      - name: 🎉 Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          name: Release ${{ steps.changelog.outputs.version }}
          body_path: CHANGELOG.txt
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 📢 Release notification
        run: |
          echo "🎉 Release ${{ steps.changelog.outputs.version }} created!"
          echo "📦 Version: ${{ steps.changelog.outputs.version }}"
          echo "🔗 URL: ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ steps.changelog.outputs.version }}"
