name: Setup Node.js and install npm dependencies
description: Configure the requested Node.js version with npm caching and install the lockfile-pinned dependencies.

inputs:
  node-version:
    description: Node.js version or version range to install.
    required: true

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm

    - name: Install dependencies
      shell: bash
      run: npm ci
